<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Store Details - LOKA Partner
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            color: #222;
        }

        /* ============================= */
        /* STICKY NAV */
        /* ============================= */

        .nav {
            position: sticky;
            top: 0;
            z-index: 100;

            background: linear-gradient(135deg, #227D57 0%, #175f42 100%);

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 12px 16px;
        }

        .nav-back {
            width: 32px;
            height: 32px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.14);
            border: 0.5px solid rgba(255, 255, 255, 0.26);

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            text-decoration: none;

            font-size: 18px;
            line-height: 1;

            flex-shrink: 0;

            transition: transform 0.12s ease, background 0.12s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-back:active {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 0.26);
        }

        .nav-title {
            color: white;
            font-size: 15px;
            font-weight: 700;
        }


        /* ============================= */
        /* CONTAINER */
        /* ============================= */

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 18px;

            box-shadow:
                0 4px 15px rgba(
                    0,
                    0,
                    0,
                    0.05
                );
        }

        .title {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 18px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #444;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;

            border: 1px solid #d8dedb;
            border-radius: 10px;

            font-size: 14px;
            outline: none;

            background: white;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #227D57;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .current-image {
            width: 100%;
            max-width: 300px;
            height: 160px;

            border-radius: 12px;
            overflow: hidden;

            background: #f1f3f2;

            margin-bottom: 10px;

            border: 1px solid #d8dedb;
        }

        .current-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-help {
            margin-top: 6px;
            font-size: 12px;
            color: #777;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 20px;
        }

        .btn {
            min-height: 46px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 14px;
            font-weight: 800;

            text-decoration: none;
            cursor: pointer;
        }

        .cancel-btn {
            background: #f1f3f2;
            color: #555;

            border: 1px solid #d8dedb;
        }

        .save-btn {
            background: #227D57;
            color: white;

            border: none;
        }

        /* STORE TIMINGS */

        .timings-section {
            margin-top: 28px;
            padding: 22px;
            background: #f8faf9;
            border: 1px solid #e2e8e5;
            border-radius: 14px;
        }

        .section-title {
            font-size: 19px;
            font-weight: 700;
            color: #173f2b;
            margin-bottom: 5px;
        }

        .timing-help {
            font-size: 13px;
            color: #718096;
            margin-bottom: 18px;
        }

        .timing-row {
            display: grid;
            grid-template-columns: 120px 1fr 90px;
            align-items: center;
            gap: 18px;
            padding: 14px 0;
            border-bottom: 1px solid #e5e9e7;
        }

        .timing-row:last-child {
            border-bottom: none;
        }

        .timing-day {
            font-weight: 600;
            color: #26352d;
        }

        .timing-fields {
            display: flex;
            gap: 14px;
        }

        .timing-field {
            flex: 1;
        }

        .timing-field label {
            display: block;
            font-size: 12px;
            color: #718096;
            margin-bottom: 5px;
        }

        .timing-field input[type="time"] {
            width: 100%;
            box-sizing: border-box;
        }

        .closed-check {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            white-space: nowrap;
        }

        .closed-check input {
            width: 16px;
            height: 16px;
            margin: 0;
        }

        @media (max-width: 600px) {

            .container {
                padding: 14px;
            }

            .card {
                padding: 15px;
            }

            .field {
                margin-bottom: 13px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .timing-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .timing-fields {
                gap: 10px;
            }

            .closed-check {
                margin-top: 2px;
            }

        }

    </style>

</head>


<body>


<!-- ================================= -->
<!-- STICKY NAV -->
<!-- ================================= -->

<div class="nav">

    <a
        href="{% url 'partner_dashboard' %}"
        class="nav-back"
        aria-label="Back"
    >
        &#8249;
    </a>

    <span class="nav-title">
        Store Details
    </span>

</div>


<main class="container">

    <div class="card">

        <div class="title">
            🏪 Store Details
        </div>


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <!-- STORE NAME -->

            <div class="field">

                <label>
                    Store Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ store.name }}"
                    required
                >

            </div>


            <!-- CATEGORY -->

            <div class="field">

                <label>
                    Category
                </label>

                <select
                    name="category"
                    required
                >

                    {% for category in categories %}

                        <option
                            value="{{ category.id }}"
                            {% if category.id == store.category_id %}
                                selected
                            {% endif %}
                        >
                            {{ category.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- DESCRIPTION -->

            <div class="field">

                <label>
                    Store Description
                </label>

                <textarea
                    name="description"
                    placeholder="Tell customers about your store..."
                >{{ store.description }}</textarea>

            </div>


            <!-- STORE IMAGE -->

            <div class="field">

                <label>
                    Store Image
                </label>

                {% if store.image %}

                    <div class="current-image">

                        <img
                            src="{{ store.image.url }}"
                            alt="{{ store.name }}"
                        >

                    </div>

                    <div class="image-help">
                        Select a new image to replace the current image.
                    </div>

                {% else %}

                    <div class="image-help">
                        No store image uploaded yet.
                    </div>

                {% endif %}

                <input
                    type="file"
                    name="image"
                    accept="image/*"
                >

            </div>

            <!-- STORE TIMINGS -->
            <div class="timings-section">

                <div class="section-title">
                    🕒 Store Timings
                </div>

                <div class="timing-help">
                    Set the opening and closing time for each day.
                </div>

                {% for row in timing_rows %}
                <div class="timing-row">

                    <div class="timing-day">
                        {{ row.day }}
                    </div>

                    <div class="timing-fields">

                        <div class="timing-field">
                            <label>Opening</label>
                            <input
                                type="time"
                                name="open_time_{{ row.day }}"
                                value="{{ row.open_time }}"
                            >
                        </div>

                        <div class="timing-field">
                            <label>Closing</label>
                            <input
                                type="time"
                                name="close_time_{{ row.day }}"
                                value="{{ row.close_time }}"
                            >
                        </div>

                    </div>

                    <label class="closed-check">
                        <input
                            type="checkbox"
                            name="closed_{{ row.day }}"
                            {% if row.is_closed %}checked{% endif %}
                        >
                        <span>Closed</span>
                    </label>

                </div>
                {% endfor %}

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <a
                    href="{% url 'partner_dashboard' %}"
                    class="btn cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn save-btn"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</main>


</body>

</html>
