<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Store Details - LOKA Partner
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            color: #222;
        }

        .header {
            background: #227D57;
            color: white;
            padding: 20px;
        }

        .header-content {
            max-width: 700px;
            margin: auto;
        }

        .brand {
            font-size: 13px;
            opacity: 0.85;
        }

        .store-name {
            font-size: 22px;
            font-weight: 800;
            margin-top: 5px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;

            box-shadow:
                0 4px 15px rgba(
                    0,
                    0,
                    0,
                    0.05
                );
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 22px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
            color: #444;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;

            border: 1px solid #d8dedb;
            border-radius: 10px;

            font-size: 14px;
            outline: none;

            background: white;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #227D57;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .current-image {
            width: 100%;
            max-width: 300px;
            height: 180px;

            border-radius: 12px;
            overflow: hidden;

            background: #f1f3f2;

            margin-bottom: 12px;

            border: 1px solid #d8dedb;
        }

        .current-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-help {
            margin-top: 7px;
            font-size: 12px;
            color: #777;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 25px;
        }

        .btn {
            min-height: 46px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 14px;
            font-weight: 800;

            text-decoration: none;
            cursor: pointer;
        }

        .cancel-btn {
            background: #f1f3f2;
            color: #555;

            border: 1px solid #d8dedb;
        }

        .save-btn {
            background: #227D57;
            color: white;

            border: none;
        }

        @media (max-width: 600px) {

            .container {
                padding: 15px;
            }

            .card {
                padding: 16px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="header-content">

        <div class="brand">
            LOKA PARTNER
        </div>

        <div class="store-name">
            {{ store.name }}
        </div>

    </div>

</header>


<main class="container">

    <div class="card">

        <div class="title">
            🏪 Store Details
        </div>


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <!-- STORE NAME -->

            <div class="field">

                <label>
                    Store Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ store.name }}"
                    required
                >

            </div>


            <!-- CATEGORY -->

            <div class="field">

                <label>
                    Category
                </label>

                <select
                    name="category"
                    required
                >

                    {% for category in categories %}

                        <option
                            value="{{ category.id }}"
                            {% if category.id == store.category_id %}
                                selected
                            {% endif %}
                        >
                            {{ category.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- DESCRIPTION -->

            <div class="field">

                <label>
                    Store Description
                </label>

                <textarea
                    name="description"
                    placeholder="Tell customers about your store..."
                >{{ store.description }}</textarea>

            </div>


            <!-- STORE IMAGE -->

            <div class="field">

                <label>
                    Store Image
                </label>

                {% if store.image %}

                    <div class="current-image">

                        <img
                            src="{{ store.image.url }}"
                            alt="{{ store.name }}"
                        >

                    </div>

                    <div class="image-help">
                        Select a new image to replace the current image.
                    </div>

                {% else %}

                    <div class="image-help">
                        No store image uploaded yet.
                    </div>

                {% endif %}

                <input
                    type="file"
                    name="image"
                    accept="image/*"
                >

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <a
                    href="{% url 'partner_dashboard' %}"
                    class="btn cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn save-btn"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</main>


</body>

</html>
