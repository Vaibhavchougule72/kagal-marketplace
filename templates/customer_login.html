<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOKA Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(23, 107, 77, 0.06),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(245, 166, 35, 0.08),
                    transparent 25%
                ),
                #fafcf9;

            color: #202522;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 18px;

            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND DECORATIONS
        ========================== */

        body::before {
            content: "";
            position: fixed;

            width: 350px;
            height: 350px;

            background: rgba(23, 107, 77, 0.035);

            border-radius: 50%;

            top: -170px;
            left: -170px;

            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;

            width: 300px;
            height: 300px;

            background: rgba(245, 166, 35, 0.045);

            border-radius: 50%;

            bottom: -150px;
            right: -150px;

            pointer-events: none;
        }


        /* =========================
           MAIN CONTAINER
        ========================== */

        body > div {
            width: 100%;
            max-width: 470px;

            position: relative;
            z-index: 2;

            text-align: center;
        }


        /* =========================
           LOGO
        ========================== */

        .loka-logo {
            width: 210px;
            max-width: 65%;

            display: block;

            margin: 0 auto 8px;

            object-fit: contain;
        }


        /* =========================
           TAGLINE
        ========================== */

        .tagline {
            font-size: 18px;

            color: #292929;

            margin-top: 2px;
            margin-bottom: 13px;

            font-weight: 500;

            letter-spacing: 0.1px;
        }

        .tagline-line {
            width: 105px;
            height: 3px;

            margin: 0 auto 24px;

            background: #f5a623;

            border-radius: 10px;

            position: relative;
        }

        .tagline-line::after {
            content: "♥";

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background: #fafcf9;

            color: #f5a623;

            font-size: 17px;

            padding: 0 7px;
        }


        /* =========================
           LOGIN CARD
        ========================== */

        .login-card {
            background: #ffffff;

            border-radius: 28px;

            padding: 38px 34px 32px;

            box-shadow:
                0 18px 55px rgba(23, 107, 77, 0.10),
                0 4px 15px rgba(0, 0, 0, 0.035);

            border: 1px solid rgba(23, 107, 77, 0.06);

            text-align: left;
        }


        /* =========================
           SMALL LOCAL ICON
        ========================== */

        .login-icon {
            width: 78px;
            height: 78px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #f2f8f4,
                    #f8fbf8
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 37px;

            border: 1px solid #e6eee9;

            position: relative;
        }

        .login-icon::after {
            content: "";

            position: absolute;

            width: 11px;
            height: 11px;

            background: #f5a623;

            border-radius: 50%;

            right: 9px;
            top: 9px;

            border: 3px solid #ffffff;
        }


        /* =========================
           HEADING
        ========================== */

        h1 {
            text-align: center;

            font-size: 31px;

            line-height: 1.2;

            font-weight: 750;

            color: #176b4d;

            letter-spacing: -0.6px;

            margin-bottom: 8px;
        }


        /* =========================
           SUBTITLE
        ========================== */

        .subtitle {
            text-align: center;

            font-size: 16px;

            color: #707873;

            line-height: 1.5;

            margin-bottom: 28px;
        }


        /* =========================
           FORM
        ========================== */

        form {
            width: 100%;
        }

        label {
            display: block;

            font-size: 15px;

            font-weight: 650;

            color: #252a27;

            margin-bottom: 9px;
        }


        /* =========================
           PHONE INPUT
        ========================== */

        .phone-wrapper {
            width: 100%;

            height: 58px;

            display: flex;
            align-items: center;

            background: #ffffff;

            border: 1.5px solid #d7e2dc;

            border-radius: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;

            overflow: hidden;
        }

        .phone-wrapper:focus-within {
            border-color: #176b4d;

            box-shadow:
                0 0 0 4px rgba(23, 107, 77, 0.08);
        }

        .country-code {
            color: #176b4d;

            font-size: 17px;

            font-weight: 700;

            padding-left: 17px;
            padding-right: 14px;

            white-space: nowrap;
        }

        .phone-divider {
            height: 28px;

            width: 1px;

            background: #dce4df;
        }

        input[type="tel"] {
            flex: 1;

            width: 100%;

            height: 100%;

            border: none;
            outline: none;

            padding: 0 15px;

            font-size: 16px;

            color: #202522;

            background: transparent;
        }

        input[type="tel"]::placeholder {
            color: #a1aaa5;
        }

        input[type="tel"]::-webkit-inner-spin-button,
        input[type="tel"]::-webkit-outer-spin-button {
            appearance: none;
        }


        /* =========================
           CONTINUE BUTTON
        ========================== */

        button {
            width: 100%;

            height: 58px;

            margin-top: 22px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #176b4d,
                    #0e7952
                );

            color: #ffffff;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 13px;

            box-shadow:
                0 9px 20px rgba(23, 107, 77, 0.18);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                opacity 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 12px 25px rgba(23, 107, 77, 0.22);
        }

        button:active {
            transform: translateY(1px);

            box-shadow:
                0 5px 12px rgba(23, 107, 77, 0.15);
        }

        button:disabled {
            cursor: not-allowed;

            opacity: 0.75;

            transform: none;
        }

        .arrow {
            font-size: 25px;

            line-height: 1;

            margin-top: -2px;
        }


        /* =========================
           MESSAGE
        ========================== */

        #message {
            min-height: 24px;

            margin-top: 16px;

            text-align: center;

            font-size: 14px;

            font-weight: 500;

            color: #707873;

            line-height: 1.4;
        }

        #message.error {
            color: #c0392b;
        }

        #message.success {
            color: #176b4d;
        }


        /* =========================
           SECURITY NOTE
        ========================== */

        .security-note {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 8px;

            margin-top: 20px;

            color: #7b847f;

            font-size: 13px;
        }

        .security-icon {
            width: 23px;
            height: 23px;

            border-radius: 50%;

            background: #e9f4ed;

            color: #176b4d;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 12px;

            font-weight: 700;
        }


        /* =========================
           BENEFITS
        ========================== */

        .benefits {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 10px;

            margin-top: 31px;
        }

        .benefit {
            text-align: center;

            position: relative;
        }

        .benefit:not(:last-child)::after {
            content: "";

            position: absolute;

            width: 1px;

            height: 48px;

            background: #dce5df;

            right: -5px;

            top: 10px;
        }

        .benefit-icon {
            width: 52px;
            height: 52px;

            margin: 0 auto 9px;

            border-radius: 50%;

            background: #eef6f0;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 24px;
        }

        .benefit-title {
            font-size: 13px;

            font-weight: 700;

            color: #252a27;

            margin-bottom: 3px;
        }

        .benefit-text {
            font-size: 11px;

            color: #858d88;

            line-height: 1.3;
        }


        /* =========================
           FOOTER
        ========================== */

        .footer {
            margin-top: 30px;

            padding-top: 19px;

            border-top: 1px solid #e4ebe6;

            text-align: center;
        }

        .footer-text {
            font-size: 13px;

            color: #176b4d;

            font-weight: 600;

            line-height: 1.5;
        }

        .footer-heart {
            color: #f5a623;

            font-size: 16px;

            margin-left: 3px;
        }


        /* =========================
           LOADING SPINNER
        ========================== */

        .spinner {
            width: 18px;
            height: 18px;

            border: 2px solid rgba(255, 255, 255, 0.35);

            border-top-color: #ffffff;

            border-radius: 50%;

            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================== */

        @media (max-width: 480px) {

            body {
                padding:
                    22px 15px 25px;

                align-items: flex-start;
            }

            body > div {
                max-width: 420px;
            }

            .loka-logo {
                width: 175px;

                margin-top: 4px;
            }

            .tagline {
                font-size: 16px;

                margin-bottom: 11px;
            }

            .tagline-line {
                margin-bottom: 20px;
            }

            .login-card {
                border-radius: 23px;

                padding:
                    28px 22px 25px;
            }

            .login-icon {
                width: 68px;
                height: 68px;

                font-size: 31px;

                margin-bottom: 16px;
            }

            h1 {
                font-size: 27px;
            }

            .subtitle {
                font-size: 15px;

                margin-bottom: 24px;
            }

            label {
                font-size: 14px;
            }

            .phone-wrapper {
                height: 55px;
            }

            button {
                height: 55px;

                font-size: 16px;
            }

            .benefits {
                margin-top: 27px;

                gap: 5px;
            }

            .benefit-icon {
                width: 46px;
                height: 46px;

                font-size: 21px;
            }

            .benefit-title {
                font-size: 12px;
            }

            .benefit-text {
                font-size: 10px;
            }

            .footer {
                margin-top: 25px;
            }
        }


        /* =========================
           VERY SMALL DEVICES
        ========================== */

        @media (max-width: 350px) {

            body {
                padding-left: 11px;
                padding-right: 11px;
            }

            .login-card {
                padding-left: 17px;
                padding-right: 17px;
            }

            .benefit-text {
                display: none;
            }

            .benefit-title {
                font-size: 11px;
            }

            .country-code {
                padding-left: 12px;
                padding-right: 10px;
            }

            input[type="tel"] {
                padding-left: 10px;
            }
        }
    </style>
</head>


<body>

<div>

    <!-- =========================
         LOKA BRAND
    ========================== -->

    <img
        src="/static/images/loka-logo.png"
        alt="LOKA"
        class="loka-logo"
    >

    <div class="tagline-line"></div>


    <!-- =========================
         LOGIN CARD
    ========================== -->

    <div class="login-card">

        <div class="login-icon">
            🍽️
        </div>


        <h1>LOKA LOGIN</h1>

        <p class="subtitle">
            Login using your mobile number
        </p>


        <form id="loginForm">

            {% csrf_token %}


            <label>
                Mobile Number
            </label>


            <div class="phone-wrapper">

                <span class="country-code">
                    +91
                </span>

                <span class="phone-divider"></span>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                    placeholder="Enter mobile number"
                    required
                >

            </div>


            <button
                type="submit"
                id="continueButton"
            >
                <span id="buttonText">
                    Continue
                </span>

                <span
                    class="arrow"
                    id="buttonArrow"
                >
                    →
                </span>
            </button>

        </form>


        <!-- OTP / ERROR MESSAGE -->

        <div id="message"></div>


        <!-- SECURITY -->

        <div class="security-note">

            <span class="security-icon">
                ✓
            </span>

            <span>
                Your number is safe with us
            </span>

        </div>

    </div>


    <!-- =========================
         LOKA BENEFITS
    ========================== -->

    <div class="benefits">

        <div class="benefit">

            <div class="benefit-icon">
                🛵
            </div>

            <div class="benefit-title">
                Fast Delivery
            </div>

            <div class="benefit-text">
                At your doorstep
            </div>

        </div>


        <div class="benefit">

            <div class="benefit-icon">
                🍽️
            </div>

            <div class="benefit-title">
                Best Food
            </div>

            <div class="benefit-text">
                From local stores
            </div>

        </div>


        <div class="benefit">

            <div class="benefit-icon">
                👥
            </div>

            <div class="benefit-title">
                For Our People
            </div>

            <div class="benefit-text">
                By our community
            </div>

        </div>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <div class="footer">

        <div class="footer-text">
            LOKA आहे आपलं, सेवा आहे आपल्यासाठी
            <span class="footer-heart">♥</span>
        </div>

    </div>

</div>


<script>

const form = document.getElementById("loginForm");

const continueButton =
    document.getElementById("continueButton");

const buttonText =
    document.getElementById("buttonText");

const buttonArrow =
    document.getElementById("buttonArrow");


form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const phone =
        document.getElementById("phone").value.trim();


    const csrfToken =
        document.querySelector(
            "[name=csrfmiddlewaretoken]"
        ).value;


    const message =
        document.getElementById("message");


    /* =========================
       BASIC PHONE VALIDATION
    ========================== */

    if (!/^[6-9]\d{9}$/.test(phone)) {

        message.innerText =
            "Please enter a valid 10-digit mobile number.";

        message.className = "error";

        return;
    }


    /* =========================
       LOADING STATE
    ========================== */

    message.innerText =
        "Sending OTP...";

    message.className = "";

    continueButton.disabled = true;

    buttonText.innerText =
        "Sending...";

    buttonArrow.innerHTML =
        '<span class="spinner"></span>';


    /* =========================
       FORM DATA
    ========================== */

    const formData =
        new FormData();

    formData.append(
        "phone",
        phone
    );


    try {

        const response =
            await fetch(
                "{% url 'send_login_otp' %}",
                {
                    method: "POST",

                    headers: {
                        "X-CSRFToken":
                            csrfToken
                    },

                    body: formData
                }
            );


        const data =
            await response.json();


        if (data.success) {

            message.innerText =
                "OTP sent successfully.";

            message.className =
                "success";


            window.location.href =
                "{% url 'verify_login_otp' %}"
                + "?phone="
                + encodeURIComponent(
                    data.phone
                );

        } else {

            message.innerText =
                data.message ||
                "Something went wrong.";

            message.className =
                "error";


            continueButton.disabled =
                false;

            buttonText.innerText =
                "Continue";

            buttonArrow.innerText =
                "→";
        }


    } catch (error) {

        console.error(error);


        message.innerText =
            "Unable to connect. Please try again.";

        message.className =
            "error";


        continueButton.disabled =
            false;

        buttonText.innerText =
            "Continue";

        buttonArrow.innerText =
            "→";
    }

});

</script>

</body>
</html>
