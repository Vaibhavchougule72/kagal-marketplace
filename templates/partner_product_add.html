<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product - LOKA Partner</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            color: #222;
        }

        /* ============================= */
        /* NAV */
        /* ============================= */

        .nav {
            position: sticky;
            top: 0;
            z-index: 100;

            background: linear-gradient(
                135deg,
                #227D57 0%,
                #175f42 100%
            );

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 12px 16px;
        }

        .nav-back {
            width: 32px;
            height: 32px;

            border-radius: 50%;

            background: rgba(255,255,255,0.14);
            border: 0.5px solid rgba(255,255,255,0.26);

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            text-decoration: none;

            font-size: 18px;
        }

        .nav-title {
            color: white;
            font-size: 15px;
            font-weight: 700;
        }

        /* ============================= */
        /* CONTAINER */
        /* ============================= */

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .page-title {
            margin-bottom: 18px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 26px;
        }

        .page-title p {
            margin-top: 6px;
            color: #777;
            font-size: 14px;
        }

        /* ============================= */
        /* FORM CARD */
        /* ============================= */

        .form-card {
            background: white;
            border-radius: 15px;
            padding: 18px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.05);
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;

            color: #333;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;

            padding: 13px;

            border: 1px solid #d8e2dc;
            border-radius: 10px;

            background: white;

            font-size: 14px;

            outline: none;
        }

        .field textarea {
            min-height: 110px;
            resize: vertical;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: #227D57;
        }

        /* ============================= */
        /* IMAGE */
        /* ============================= */

        .image-box {
            border: 1px dashed #b8c9bf;
            border-radius: 12px;

            padding: 18px;

            text-align: center;

            background: #fafcfb;
        }

        .image-box input {
            border: none;
            padding: 0;
        }

        /* ============================= */
        /* CHECKBOXES */
        /* ============================= */

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 11px;

            background: #f7faf8;

            border-radius: 9px;

            font-size: 14px;
        }

        .checkbox-item input {
            width: 18px;
            height: 18px;
        }

        /* ============================= */
        /* SECTION */
        /* ============================= */

        .section-title {
            margin: 25px 0 13px;

            font-size: 16px;
            font-weight: 800;

            color: #227D57;
        }

        /* ============================= */
        /* BUTTONS */
        /* ============================= */

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;

            margin-top: 25px;
        }

        .btn {
            min-height: 46px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 14px;
            font-weight: 700;

            text-decoration: none;

            cursor: pointer;
        }

        .cancel-btn {
            background: #f2f5f3;
            color: #555;

            border: 1px solid #d8e2dc;
        }

        .save-btn {
            background: #227D57;
            color: white;

            border: none;
        }

        .save-btn:active,
        .cancel-btn:active {
            transform: scale(0.98);
        }

        /* ============================= */
        /* MOBILE */
        /* ============================= */

        @media (max-width: 600px) {

            .container {
                padding: 15px;
            }

            .actions {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<!-- ============================= -->
<!-- NAV -->
<!-- ============================= -->

<div class="nav">

    <a
        href="{% url 'partner_products' %}"
        class="nav-back"
        aria-label="Back"
    >
        &#8249;
    </a>

    <span class="nav-title">
        Add Product
    </span>

</div>


<main class="container">

    <!-- ============================= -->
    <!-- TITLE -->
    <!-- ============================= -->

    <div class="page-title">

        <h1>
            Add New Product
        </h1>

        <p>
            Add a new product to {{ store.name }}
        </p>

    </div>


    <!-- ============================= -->
    <!-- FORM -->
    <!-- ============================= -->

    <form
        method="POST"
        enctype="multipart/form-data"
        class="form-card"
    >

        {% csrf_token %}


        <!-- PRODUCT NAME -->

        <div class="field">

            <label>
                Product Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter product name"
                required
            >

        </div>


        <!-- CATEGORY -->

        <div class="field">

            <label>
                Category
            </label>

            <select
                name="category"
                required
            >

                <option value="">
                    Select Category
                </option>

                {% for category in categories %}

                    <option value="{{ category.id }}">
                        {{ category.name }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- PRICE -->

        <div class="field">

            <label>
                Price
            </label>

            <input
                type="number"
                name="price"
                step="0.01"
                min="0"
                placeholder="Enter price"
                required
            >

        </div>


        <!-- DISCOUNT PRICE -->

        <div class="field">

            <label>
                Discount Price
            </label>

            <input
                type="number"
                name="discount_price"
                step="0.01"
                min="0"
                placeholder="Optional"
            >

        </div>


        <!-- DESCRIPTION -->

        <div class="field">

            <label>
                Description
            </label>

            <textarea
                name="description"
                placeholder="Enter product description"
            ></textarea>

        </div>


        <!-- IMAGE -->

        <div class="field">

            <label>
                Product Image
            </label>

            <div class="image-box">

                <input
                    type="file"
                    name="image"
                    accept="image/*"
                >

            </div>

        </div>


        <!-- PRODUCT SETTINGS -->

        <div class="section-title">
            Product Settings
        </div>

        <div class="checkbox-group">

            <label class="checkbox-item">

                <input
                    type="checkbox"
                    name="is_active"
                    checked
                >

                Product Active

            </label>


            <label class="checkbox-item">

                <input
                    type="checkbox"
                    name="is_featured"
                >

                Featured Product

            </label>


            <label class="checkbox-item">

                <input
                    type="checkbox"
                    name="is_hero"
                >

                Hero Product

            </label>


            <label class="checkbox-item">

                <input
                    type="checkbox"
                    name="upi_only"
                >

                UPI Only

            </label>

        </div>


        <!-- AVAILABILITY -->

        <div class="section-title">
            Time Availability
        </div>

        <div class="checkbox-group">

            <label class="checkbox-item">

                <input
                    type="checkbox"
                    name="unavailable_10_12"
                >

                Unavailable 10:00 AM – 12:00 PM

            </label>


            <label class="checkbox-item">

                <input
                    type="checkbox"
                    name="unavailable_12_3"
                >

                Unavailable 12:00 PM – 3:00 PM

            </label>


            <label class="checkbox-item">

                <input
                    type="checkbox"
                    name="unavailable_3_630"
                >

                Unavailable 3:00 PM – 6:30 PM

            </label>


            <label class="checkbox-item">

                <input
                    type="checkbox"
                    name="unavailable_630_9"
                >

                Unavailable 6:30 PM – 9:00 PM

            </label>

        </div>


        <!-- ACTIONS -->

        <div class="actions">

            <a
                href="{% url 'partner_products' %}"
                class="btn cancel-btn"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn save-btn"
            >
                Save Product
            </button>

        </div>

    </form>

</main>

</body>

</html>
