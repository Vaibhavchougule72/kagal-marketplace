<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOKA Partner Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background: #f5f7f6;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: white;

            border-radius: 20px;

            padding: 32px 24px;

            box-shadow:
                0 10px 30px rgba(
                    0,
                    0,
                    0,
                    0.08
                );
        }

        .logo {
            text-align: center;

            font-size: 32px;

            font-weight: 800;

            color: #227D57;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 28px;
        }

        label {
            display: block;

            font-weight: 600;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            margin-bottom: 18px;

            outline: none;
        }

        input:focus {
            border-color: #227D57;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #227D57;

            color: white;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;
        }

        .error {
            background: #fff0f0;

            color: #c62828;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        LOKA
    </div>

    <div class="subtitle">
        Store Partner
    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
            autocomplete="username"
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
            autocomplete="current-password"
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
