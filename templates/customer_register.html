<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create LOKA Account</title>

</head>

<body>

<div>

    <h1>CREATE YOUR LOKA ACCOUNT</h1>

    <p>
        Mobile:
        <strong>{{ phone }}</strong>
    </p>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>
            Your Name
        </label>

        <input
            type="text"
            name="name"
            maxlength="150"
            placeholder="Enter your name"
            required
        >

        <br><br>

        <label>
            Email
            <small>(Optional)</small>
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
        >

        <br><br>

        <button type="submit">
            Create Account
        </button>

    </form>

</div>

</body>

</html>
